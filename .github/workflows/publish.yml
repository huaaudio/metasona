name: Build and publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    name: Build and test source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          cmake_version = re.search(r"VERSION\s+(\d+\.\d+\.\d+)", Path("CMakeLists.txt").read_text())[1]
          assert version == cmake_version, "Python and CMake versions must match"
          tag = os.environ["RELEASE_TAG"]
          if tag:
              assert tag == f"v{version}", f"Expected release tag v{version}, got {tag}"
          PY
      - name: Build source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - name: Install and test from source distribution
        run: |
          python -m venv "$RUNNER_TEMP/sdist-test"
          "$RUNNER_TEMP/sdist-test/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-test/bin/python" .github/scripts/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels (${{ matrix.os }}, ${{ matrix.arch }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-2022
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test native wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          # Match the current NumPy/SciPy binary baseline; musl uses the sdist.
          CIBW_SKIP: "*-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_TEST_COMMAND: 'python "{project}/.github/scripts/smoke_test.py"'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  check:
    name: Check all distribution metadata
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install twine
          python -m twine check --strict dist/*

  publish:
    name: Publish to PyPI
    needs: check
    if: github.event_name == 'release' && github.repository == 'huaaudio/metasona'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/metasona
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
